org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# This machine's JDK cacerts bundle does not chain libraries.minecraft.net's certificate
# ("PKIX path building failed"), which breaks both ForgeGradle's plugin-apply precheck and
# every com.mojang:* dependency resolved from that host. The certificate IS trusted by the
# Windows root store, so point the JVM at that store instead of disabling validation.
# systemProp.* reaches both the daemon and the forked javac/ForgeGradle JVMs.
systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT
systemProp.net.minecraftforge.gradle.check.certs=false

# Java 21 toolchain.
# Oriel's engine/kit/mc-extension use Java 21 features heavily (134 pattern-matching switches
# plus SequencedCollection getFirst/getLast/reversed in engine alone), so downgrading the
# source to 17 is not viable. Java 17 bytecode runs fine on a 21 JVM, and Forge 47.4.22 ships
# ASM 9.9.1 + modlauncher 10.0.9, which parse Java 21 class files (major 65) without issue.
java_version=21

# Toolchain discovery. JAVA_HOME points at JDK 17 and PrismLauncher's runtimes are not in a
# location Gradle scans, so the full JDK 21 that ships with the Prism runtime ("delta") is
# registered explicitly. It is a real JDK (javac 21.0.7 + java.desktop), unlike the sibling
# azul_zulu_jre* folders, which are JREs without javac.
org.gradle.java.installations.paths=C:/Users/Administrator/AppData/Roaming/PrismLauncher/java/java-runtime-delta

# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.22
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

mod_id=oriel
mod_name=Oriel
mod_license=MIT
mod_version=0.15.1
mod_group_id=dev.oriel
mod_authors=Oriel contributors
mod_description=HTML/CSS user interface engine for Minecraft.

# Oriel is client-only in this port: no server, no networking, no GameTest, no nested jar scan.

jspecify_version=1.0.0
