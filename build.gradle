plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    // Oriel moves vanilla inventory slots to wherever a page's <slot> element put them, which means
    // writing Slot.x / Slot.y. In 1.20.1 both are `public final int`, so the AT widens them to
    // `public` (which also drops `final`). 0.15.1 needed an access widener for the same reason.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // `./gradlew runClient -Pautopilot` (or -Pautopilot=example) drives DevAutopilot. The loader build scripts
            // turn these project properties into system properties on the forked game JVM; without this wiring the
            // properties stay on Gradle's own JVM and the autopilot never sees them.
            if (project.hasProperty('autopilot')) {
                property 'oriel.autopilot', 'true'
                String only = project.findProperty('autopilot')?.toString()
                if (only && only != 'true') property 'oriel.autopilot.only', only
                if (only == 'example') args '--width', '1280', '--height', '720'
                if (project.hasProperty('borderDebug')) property 'oriel.debug.border', 'true'
                if (project.hasProperty('blitDebug')) property 'oriel.debug.blit', 'true'
            }
        }
    }
}

// Oriel's assets (fonts, reference pages, icons) are generated into the same package tree as
// hand-written resources, so `src/main` must win over `src/generated` when both carry a file:
// sourceDirs order [main, generated] + EXCLUDE gives "first wins" semantics.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven {
        name = 'Aliyun Maven Central Mirror'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Maven Central'
        url = 'https://repo1.maven.org/maven2/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The source uses jspecify's @Nullable (46 files, carried over verbatim from 0.15.1). 1.20.1's Forge
    // toolchain does not ship it, so take it from Maven Central. compileOnly: the annotation is class-retention
    // only and nothing reflects on it at runtime.
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    // expand() reads with the platform charset by default (GBK on Windows), which mangles
    // UTF-8 multi-byte characters such as the em dash and corrupts mods.toml, crashing FML
    // on load. Pin both read and write to UTF-8.
    setFilteringCharset('UTF-8')

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The port introduces many compile errors at once; javac stops at 100 by default and hides the real scope.
    options.compilerArgs << '-Xmaxerrs' << '10000'
}
